CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# See toucan_left.conf.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# The XIAO board config turns USB on, but a split peripheral has no USB role
# (ZMK_USB depends on !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL), so turn it back
# off: dead code here, and Kconfig warns about the assignment on every build.
CONFIG_ZMK_USB=n
