CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# To hopefully improve bluetooth interference when crossing the central unit
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
# +8 dBm is the ceiling on the nRF52840; BT_CTLR_TX_PWR_PLUS_12, which this used
# to ask for, is not a symbol at all.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes, but 60 minutes is only very slightly more power draw
# and the experience is much better than having the keyboard go to deep sleep
# (i.e. having to reconnect to bluetooth).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
