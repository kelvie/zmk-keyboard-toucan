CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# To hopefully improve bluetooth interference when crossing the central unit
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
# +8 dBm is the ceiling on the nRF52840; BT_CTLR_TX_PWR_PLUS_12, which this used
# to ask for, is not a symbol at all.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes, but 60 minutes is only very slightly more power draw
# and the experience is much better than having the keyboard go to deep sleep
# (i.e. having to reconnect to bluetooth).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ZMK's idle behaviour before that, default 30s. This is what keeps the pad
# cheap (1.7mA idle vs 2.9mA active); the only user-visible effect is that the
# pad takes ~300ms to see touches when next pressed, suppressed if a key was
# pressed in the last 30 seconds.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# The pad's input processors are chained; the default stack overflows.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Status screen style: 0 = the original nice_view_gem layout, 1 = vertical
# battery, 2 = the arc layout (battery arcs, WPM bar graph, BT profile dots).
CONFIG_TOUCAN_STATUS_SCREEN=2

# What the display calls each Bluetooth profile (max 12 chars; empty = no
# label, just the dots). The advertised BLE name stays CONFIG_ZMK_KEYBOARD_NAME
# for every profile - Zephyr has no setter for it at runtime.
CONFIG_ZMK_BT_PROFILE_0_NAME=""
CONFIG_ZMK_BT_PROFILE_1_NAME=""
CONFIG_ZMK_BT_PROFILE_2_NAME=""
CONFIG_ZMK_BT_PROFILE_3_NAME=""
CONFIG_ZMK_BT_PROFILE_4_NAME=""
